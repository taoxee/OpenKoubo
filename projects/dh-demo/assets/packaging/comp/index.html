<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>packaging</title>
<style>
  @font-face { font-family: "PingFang SC"; src: local("PingFang SC"); }
  @font-face { font-family: "Hiragino Sans GB"; src: local("Hiragino Sans GB"); }
  @font-face { font-family: "Microsoft YaHei"; src: local("Microsoft YaHei"); }
  html, body {
    margin: 0; padding: 0; background: transparent;
    width: 720px; height: 1280px; overflow: hidden;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  .stage {
    position: relative; width: 720px; height: 1280px;
    background: transparent;
  }
  /* 钩子卡：前 1.8s（贴顶部，避开人脸中轴） */
  .hook-card {
    position: absolute; left: 36px; top: 70px;
    padding: 18px 26px 16px;
    background: linear-gradient(135deg, rgba(16,16,20,0.82), rgba(16,16,20,0.62));
    border-left: 6px solid #FF4D6A;
    border-radius: 14px;
    max-width: 503px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.45);
  }
  .hk-line {
    font-size: 48px;
    font-weight: 900; color: #FFFFFF;
    line-height: 1.25; letter-spacing: 1px;
    text-shadow: 0 2px 12px rgba(0,0,0,0.6);
  }
  .hk-sub {
    margin-top: 10px;
    font-size: 23px;
    font-weight: 600; color: rgba(255,255,255,0.85);
    letter-spacing: 2px;
  }
  /* AI 角标已按用户要求移除（2026-11-02）：发布时在平台页勾选「AI 生成」声明即可 */
</style>
</head>
<body>
  <div class="stage" data-composition-id="packaging" data-no-timeline
       data-width="720" data-height="1280"
       data-duration="9.27" data-fps="30">

    <div class="clip" data-start="0.2" data-duration="1.6" data-track-index="1">
      <div class="hook-card">
        <div class="hk-line">一张照片 一句台词</div><div class="hk-line">生成口播视频</div>
        <div class="hk-sub">数字人工作流 · 无需出镜</div>
      </div>
    </div>

  </div>
</body>
</html>
